<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TV Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;400;500;600;700&display=swap" rel="stylesheet">
<style>
  /*
    Everything is sized in rem, and 1rem = 1/120 of the screen width:
    16px on a 1080p screen, 32px on a 4K screen. The layout is identical on both, only sharper on 4K.
  */
  html { font-size: calc(100vw / 120); }

  :root {
    --white: #ffffff;
    --soft: rgba(255, 255, 255, 0.74);
    --faint: rgba(255, 255, 255, 0.56);
    --glass: rgba(255, 255, 255, 0.14);
    --glass-edge: rgba(255, 255, 255, 0.22);
    --safe-x: 6rem;        /* 5 % of the width: TV overscan safe area */
    --safe-y: 3.75rem;
    --fade: 3s;            /* wallpaper crossfade */
    --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    font-family: "Manrope", "TizenSans", "SamsungOne", -apple-system, "Helvetica Neue", Arial, sans-serif;
    color: var(--white);
    -webkit-font-smoothing: antialiased;
    /* Fallback wallpaper, a dusk over the river: visible until a photo loads, and for good if none ever does. */
    background-color: #0f1a2b;
    background-image:
      radial-gradient(120% 90% at 85% 110%, rgba(214, 120, 92, 0.38) 0%, transparent 55%),
      radial-gradient(90% 70% at 10% 0%, rgba(74, 112, 160, 0.55) 0%, transparent 60%),
      linear-gradient(175deg, #1c2c45 0%, #142036 45%, #241d33 100%);
  }

  /* ---------- Wallpaper ---------- */
  .wall {
    position: fixed; inset: 0; width: 100%; height: 100%;
    object-fit: cover; opacity: 0;
    transition: opacity var(--fade) ease-in-out;
    will-change: opacity, transform;
  }
  .wall.shown { opacity: 1; animation: drift 330s linear forwards; }
  @keyframes drift { from { transform: scale(1.0); } to { transform: scale(1.07); } }

  /* Shade the corners where text sits, leave the middle of the photo untouched. */
  .scrim {
    position: fixed; inset: 0; pointer-events: none;
    background:
      linear-gradient(0deg, rgba(0,0,0,0.70) 0%, rgba(0,0,0,0.30) 34%, rgba(0,0,0,0) 55%),
      linear-gradient(90deg, rgba(0,0,0,0.30) 0%, rgba(0,0,0,0) 45%),
      linear-gradient(180deg, rgba(0,0,0,0.38) 0%, rgba(0,0,0,0) 24%);
    transition: opacity 1.2s ease;
  }

  /* All text and tiles live in .ui, which drifts a few pixels now and then so no pixel on the OLED stays lit the same way for hours. */
  .ui { position: fixed; inset: 0; transition: transform 6s ease-in-out; }

  /* ---------- Clock ---------- */
  .clock {
    position: fixed; left: var(--safe-x); bottom: 24rem;
    text-shadow: 0 0.125rem 2rem rgba(0,0,0,0.25);
    transition: transform 1.2s var(--ease);
    transform-origin: left bottom;
  }
  .time {
    font-size: 12.5rem; font-weight: 300; line-height: 0.9;
    letter-spacing: -0.04em; font-variant-numeric: tabular-nums;
  }
  .date { font-size: 2.25rem; font-weight: 500; color: var(--soft); margin-top: 1.25rem; padding-left: 0.5rem; }

  /* ---------- Weather ---------- */
  .weather {
    position: fixed; top: var(--safe-y); right: var(--safe-x);
    display: flex; align-items: center; gap: 1.25rem;
    opacity: 0; transition: opacity 1s ease;
    text-shadow: 0 0.125rem 1.5rem rgba(0,0,0,0.3);
  }
  .weather.ready { opacity: 1; }
  .weather svg { width: 4.5rem; height: 4.5rem; }
  .w-temp { font-size: 4.5rem; font-weight: 300; line-height: 1; letter-spacing: -0.02em; }
  .w-text { font-size: 1.8rem; font-weight: 500; color: var(--soft); line-height: 1.35; }

  /* ---------- App row ---------- */
  .dock {
    position: fixed; left: var(--safe-x); right: var(--safe-x); bottom: 7.5rem;
    display: flex; gap: 1.375rem; list-style: none;
    transition: opacity 0.8s ease, transform 0.8s var(--ease);
  }
  .tile {
    position: relative;
    width: 10.75rem; height: 6.45rem;             /* 5:3, the tvOS app icon ratio */
    border: 0; border-radius: 1.5rem;
    background: var(--bg); color: var(--fg);
    display: flex; align-items: center; justify-content: center;
    font: inherit; cursor: pointer; outline: none;
    box-shadow: 0 0.75rem 2rem rgba(0,0,0,0.35);
    transition: transform 0.28s var(--ease), box-shadow 0.28s var(--ease);
  }
  .tile svg { width: 3.1rem; height: 3.1rem; fill: currentColor; }
  .tile .word { font-size: 1.7rem; font-weight: 700; letter-spacing: -0.02em; }
  .tile.glass {
    background: var(--glass);
    -webkit-backdrop-filter: blur(1.5rem) saturate(1.4);
    backdrop-filter: blur(1.5rem) saturate(1.4);
    box-shadow: inset 0 0 0 0.0625rem var(--glass-edge), 0 0.75rem 2rem rgba(0,0,0,0.25);
  }
  /* Resting tiles sit slightly back; the focused one comes forward. */
  .tile::before {
    content: ""; position: absolute; inset: 0; border-radius: inherit;
    background: rgba(0,0,0,0.22); transition: opacity 0.28s ease;
  }
  /* Specular sheen across the top, like light on glass. */
  .tile::after {
    content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    background: linear-gradient(165deg, rgba(255,255,255,0.32) 0%, rgba(255,255,255,0.06) 38%, rgba(255,255,255,0) 60%);
    opacity: 0; transition: opacity 0.28s ease;
  }
  .tile.focused {
    transform: translateY(-0.625rem) scale(1.1);
    box-shadow:
      0 0 0 0.1875rem rgba(255,255,255,0.95),
      0 0 2.5rem rgba(255,255,255,0.25),
      0 1.75rem 3.5rem rgba(0,0,0,0.55);
    z-index: 1;
  }
  .tile.focused::before { opacity: 0; }
  .tile.focused::after { opacity: 1; }
  .tile.pressed { transform: translateY(-0.5rem) scale(1.04); transition-duration: 0.12s; }

  .label {
    position: fixed; bottom: 3.75rem; left: var(--safe-x);
    font-size: 1.8rem; font-weight: 600;
    transition: transform 0.28s var(--ease), opacity 0.28s ease;
    white-space: nowrap;
  }

  /* ---------- Photo credit ---------- */
  .credit {
    position: fixed; left: var(--safe-x); top: var(--safe-y);
    max-width: 44rem;
    text-shadow: 0 0.125rem 1.5rem rgba(0,0,0,0.35);
    font-size: 1.4375rem; line-height: 1.4; color: var(--faint);
    transition: opacity 1s ease;
  }
  .credit b { display: block; font-weight: 600; color: var(--soft); }

  /* ---------- Launch veil ---------- */
  .veil {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2.5rem;
    background: rgba(8, 10, 16, 0.55);
    -webkit-backdrop-filter: blur(2.5rem); backdrop-filter: blur(2.5rem);
    opacity: 0; pointer-events: none; transition: opacity 0.35s ease;
  }
  .veil.shown { opacity: 1; }
  .veil .tile { transform: scale(1.6); box-shadow: 0 2rem 5rem rgba(0,0,0,0.5); }
  .veil .tile::before { opacity: 0; }
  .veil-text { margin-top: 3.5rem; font-size: 2.5rem; font-weight: 500; }
  .dots::after { content: ""; animation: dots 1.2s steps(4) infinite; }
  @keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }

  /* After a long time without input the whole screen dims, which spares the OLED panel. */
  .dimmer { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity 8s ease; }
  body.dim .dimmer { opacity: 0.8; }

  /* ---------- Ambient mode: after a while without input, only the photo and the time stay ---------- */
  body.ambient .dock, body.ambient .label { opacity: 0; transform: translateY(2rem); }
  body.ambient .credit { opacity: 0; }
  body.ambient .scrim { opacity: 0.55; }
  body.ambient .clock { transform: translateY(17rem) scale(0.8); }

  @media (prefers-reduced-motion: reduce) {
    :root { --fade: 0.01s; }
    .wall.shown { animation: none; }
    .tile, .tile::before, .tile::after, .label, .dock, .clock, .veil, .ui { transition: none; }
    .tile.focused { transform: none; }
    .tile.pressed { transform: none; }
    .veil .tile { transform: scale(1.6); }
    .dots::after { animation: none; content: "..."; }
  }
</style>
</head>
<body>
  <img class="wall" alt="" aria-hidden="true">

  <div class="ui" id="ui">

  var ICONS = {"youtube": "M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z", "netflix": "m5.398 0 8.348 23.602c2.346.059 4.856.398 4.856.398L10.113 0H5.398zm8.489 0v9.172l4.715 13.33V0h-4.715zM5.398 1.5V24c1.873-.225 2.81-.312 4.715-.398V14.83L5.398 1.5z", "jellyfin": "M12 .002C8.826.002-1.398 18.537.16 21.666c1.56 3.129 22.14 3.094 23.682 0C25.384 18.573 15.177 0 12 0zm7.76 18.949c-1.008 2.028-14.493 2.05-15.514 0C3.224 16.9 9.92 4.755 12.003 4.755c2.081 0 8.77 12.166 7.759 14.196zM12 9.198c-1.054 0-4.446 6.15-3.93 7.189.518 1.04 7.348 1.027 7.86 0 .511-1.027-2.874-7.19-3.93-7.19z", "hbomax": "M3.784 8.716c-.655 0-1.32.29-2.173.946v-.78H0v6.236h1.715V11.24c.749-.592 1.091-.78 1.372-.78.333 0 .551.209.551.729v3.928h1.715V11.23c.748-.582 1.081-.769 1.372-.769.333 0 .55.208.55.728v3.928H8.99v-4.53c0-1.403-.8-1.871-1.57-1.871-.654 0-1.32.27-2.192.936-.28-.697-.894-.936-1.444-.936zm8.689 0c-1.705 0-3.118 1.466-3.118 3.284 0 1.82 1.413 3.285 3.118 3.285.842 0 1.57-.312 2.131-.988v.82h1.632V8.883h-1.632v.822c-.561-.676-1.29-.988-2.131-.988zm4.064.166c.707 1.102 1.507 2.09 2.443 3.077a26.593 26.593 0 0 0-2.443 3.16h2.069a13.603 13.603 0 0 1 1.673-2.183 14.067 14.067 0 0 1 1.632 2.182H24a25.142 25.142 0 0 0-2.432-3.16A23.918 23.918 0 0 0 24 8.883h-2.047a14.65 14.65 0 0 1-1.674 2.11 13.357 13.357 0 0 1-1.674-2.11zm-3.804 1.279c1.018 0 1.84.82 1.84 1.84a1.837 1.837 0 0 1-1.84 1.839c-1.019 0-1.84-.82-1.84-1.84 0-1.018.821-1.84 1.84-1.84zm0 .415c-.78 0-1.414.633-1.414 1.423s.634 1.424 1.413 1.424c.78 0 1.414-.634 1.414-1.424s-.634-1.424-1.414-1.424z", "spotify": "M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-   function getJSON(url, ms) {
    return new Promise(function (resolve, reject) {
      var x = new XMLHttpRequest();
      x.open('GET', url); x.timeout = ms || 10000;
      x.onload = function () { try { resolve(JSON.parse(x.responseText)); } catch (e) { reject(e); } };

    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }

  var WX_ICONS = {
    sun: '<circle cx="12" cy="12" r="4.2"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/>',
    moon: '<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>',
    partly: '<path d="M8 3.5v1.6M3.6 8H2M4.8 4.8l1.1 1.1M12.2 4.8l-1.1 1.1"/><path d="M5.4 10.6A3.5 3.5 0 0 1 11.3 7"/><path d="M8 19.5h9.5a3.5 3.5 0 0 0 .4-7 5 5 0 0 0-9.6 1A3 3 0 0 0 8 19.5z"/>',
    cloud: '<path d="M7 19h10.5a4 4 0 0 0 .5-8 6 6 0 0 0-11.5 1.5A3.3 3.3 0 0 0 7 19z"/>',
    fog: '<path d="M4 9h16M2.5 13h19M4 17h16"/>',
    rain: '<path d="M7 15h10.5a4 4 0 0 0 .5-8 6 6 0 0 0-11.5 1.5A3.3 3.3 0 0 0 7 15z"/><path d="M8.5 18l-1 2.5M12.5 18l-1 2.5M16.5 18l-1 2.5"/>',
    snow: '<path d="M7 15h10.5a4 4 0 0 0 .5-8 6 6 0 0 0-11.5 1.5A3.3 3.3 0 0 0 7 15z"/><path d="M8 19h.01M12 20.5h.01M16 19h.01"/>',
    storm: '<path d="M7 15h10.5a4 4 0 0 0 .5-8 6 6 0 0 0-11.5 1.5A3.3 3.3 0 0 0 7 15z"/><path d="M12.5 15.5l-2 3.5h3l-2 3.5"/>'
  };
  function weather() {
    getJSON('https://api.open-meteo.com/v1/forecast?latitude=' + CITY.lat + '&longitude=' + CITY.lon +
            '&current=temperature_2m,weather_code,is_day&daily=temperature_2m_max,temperature_2m_min&timezone=Europe%2FPrague&forecast_days=1')
      .then(function (d) {
        var code = d.current.weather_code, desc = '', icon = 'cloud';
        WX.forEach(function (w) { if (w[0].indexOf(code) >= 0) { desc = w[1]; icon = w[2]; } });
        if (icon === 'sun' && !d.current.is_day) icon = 'moon';
        $('w-icon').innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">' + WX_ICONS[icon] + '</svg>';
        $('w-temp').textContent = Math.round(d.current.temperature_2m) + '°';
        $('w-desc').textContent = desc + ', ' + CITY.name;
        $('w-range').textContent = 'Max ' + Math.round(d.daily.temperature_2m_max[0]) + '°  Min ' + Math.round(d.daily.temperature_2m_min[0]) + '°';
        $('weather').classList.add('ready');
      }, function () { $('weather').classList.remove('ready'); });
  }
  weather();
  setInterval(weather, 30 * 60 * 1000);

  // ===== App row =====
  function tileHTML(app) {
    if (app.icon === 'word') return '<span class="word">' + app.name + '</span>';
    if (app.icon === 'globe') return '<svg viewBox="0 0 24 24" style="fill:none;stroke:currentColor;stroke-width:1.4"><circle cx="12" cy="12" r="9.5"/><path d="M2.5 12h19M12 2.5c2.6 2.6 3.9 5.8 3.9 9.5s-1.3 6.9-3.9 9.5c-2.6-2.6-3.9-5.8-3.9-9.5S9.4 5.1 12 2.5z"/></svg>';
    return svg(ICONS[app.icon]);
  }
  function makeTile(app) {
    var b = document.createElement('button');
    b.className = 'tile' + (app.glass ? ' glass' : '');
    if (app.bg) b.style.setProperty('--bg', app.bg);
    b.style.setProperty('--fg', app.fg);
    b.setAttribute('aria-label', app.name);
    b.innerHTML = tileHTML(app);
    return b;
  }

  var dock = $('dock'), label = $('label');
  var tiles = APPS.map(function (app, i) {
    var li = document.createElement('li');
    li.setAttribute('role', 'none');
    var b = makeTile(app);
    b.setAttribute('role', 'menuitem');
    b.addEventListener('mouseenter', function () { wake(); setFocus(i); });
    b.addEventListener('click', function () { setFocus(i); launch(); });
    li.appendChild(b); dock.appendChild(li);
    return b;
  });

  // The ring follows a class, not the browser's own focus, so it shows even when the window is not active.
  var current = 0;
  function setFocus(i) {
    tiles[current].classList.remove('focused');
    current = Math.max(0, Math.min(tiles.length - 1, i));
    var t = tiles[current];
    t.classList.add('focused');
    t.focus({ preventScroll: true });
    label.textContent = APPS[current].name;
    // The name sits centred under the focused tile.
    var r = t.getBoundingClientRect(), u = $('ui').getBoundingClientRect();
    label.style.left = (r.left - u.left + r.width / 2) + 'px';
    label.style.transform = 'translateX(-50%)';
  }

  // ===== Launching =====
  var launching = false;
  function showVeil(app, text) {
    $('veil-tile').innerHTML = '';
    $('veil-tile').appendChild(makeTile(app));
    $('veil-text').textContent = text;
    $('veil').classList.add('shown');
  }
  function hideVeil() {
    $('veil').classList.remove('shown');
    document.querySelector('.dots').style.display = '';
    launching = false;
  }
  function launch() {
    if (launching) return;
    launching = true;
    var t = tiles[current], app = APPS[current];
    t.classList.add('pressed');
    setTimeout(function () { t.classList.remove('pressed'); }, 140);
    showVeil(app, 'Spouštím ' + app.name);
    tvLaunch(app).then(function (opened) {
      return opened || openApp(app);
    }).then(function () {
      setTimeout(hideVeil, 2500);           // the app takes over the screen, the veil goes quietly
    }, function (err) {
      document.querySelector('.dots').style.display = 'none';
      $('veil-text').textContent = err.message === 'not_installed'
        ? app.name + ' na televizi není nainstalovaný'
        : 'Aplikace jde spustit jen na televizi';
      setTimeout(hideVeil, 2500);
    });
  }

  // Native Samsung apps: ask service.js, which can use the TV's app launcher.
  // TizenBrew starts service.js only when this page opens, so right after start it may need a moment.
  function openApp(app, retried) {
    var q = SERVICE + '/launch?ids=' + encodeURIComponent((app.ids || []).join(',')) + '&match=' + encodeURIComponent(app.match || '');
    return getJSON(q, 8000).then(function (d) {
      if (!d || !d.ok) throw new Error(d && d.error === 'not_installed' ? 'not_installed' : 'failed');
    }, function (err) {
      if (retried) throw err;
      return new Promise(function (r) { setTimeout(r, 2000); }).then(function () { return openApp(app, true); });
    });
  }

  // The TV's own app API, the same one the SmartThings phone app uses. The page cannot read the answer
  // (no CORS headers), so it sends the request and then checks whether an app took over the screen.
  function tvLaunch(app) {
    return new Promise(function (resolve) {
      if (!app.tv) return resolve(false);
      try {
        var x = new XMLHttpRequest();
        x.open('POST', TV_API + encodeURIComponent(app.tv));
        x.send();
      } catch (e) { return resolve(false); }
      setTimeout(function () { resolve(document.hidden); }, 3000);
    });
  }

  // ===== Ambient mode and OLED care =====
  var idleTimer, dimTimer;
  function wake() {
    var b = document.body;
    var wasAsleep = b.classList.contains('ambient') || b.classList.contains('dim');
    b.classList.remove('ambient'); b.classList.remove('dim');
    clearTimeout(idleTimer); clearTimeout(dimTimer);
    idleTimer = setTimeout(function () { b.classList.add('ambient'); }, AMBIENT_MS);
    dimTimer = setTimeout(function () { b.classList.add('dim'); }, DIM_MS);
    return wasAsleep;
  }
  var SHIFTS = [[0, 0], [0.4, 0.25], [-0.3, 0.35], [-0.4, -0.2], [0.25, -0.35]];   // in rem, a few pixels
  var shiftIndex = 0;
  setInterval(function () {
    shiftIndex = (shiftIndex + 1) % SHIFTS.length;
    $('ui').style.transform = 'translate(' + SHIFTS[shiftIndex][0] + 'rem,' + SHIFTS[shiftIndex][1] + 'rem)';
  }, SHIFT_MS);

  document.addEventListener('keydown', function (e) {
    var k = e.keyCode;
    var back = k === 10009 || k === 27;                 // Back on the remote, Esc in a browser
    if (wake()) { e.preventDefault(); return; }       // first press only wakes the screen
    if (launching) { if (back) hideVeil(); e.preventDefault(); return; }
    if (k === 37 || k === 39) { setFocus(current + (k === 39 ? 1 : -1)); e.preventDefault(); }
    else if (k === 13) { launch(); e.preventDefault(); }
    else if (back) { e.preventDefault(); }             // this is home: Back has nowhere to go
  });
  document.addEventListener('mousemove', function () { wake(); });
  // Coming back from an app: clear the launch veil and show the app row again.
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) { hideVeil(); wake(); }
  });

  setFocus(0);
  wake();
  window.addEventListener('resize', function () { setFocus(current); });
</script>
</body>
</html>
