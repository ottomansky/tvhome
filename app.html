<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TV Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;400;500;600;700&display=swap" rel="stylesheet">
<style>
  /*
    Everything is sized in rem, and 1rem = 1/120 of the screen width:
    16px on a 1080p screen, 32px on a 4K screen. The layout is identical on both, only sharper on 4K.
  */
  html { font-size: calc(100vw / 120); }

  :root {
    --white: #ffffff;
    --soft: rgba(255, 255, 255, 0.74);
    --faint: rgba(255, 255, 255, 0.56);
    --glass: rgba(255, 255, 255, 0.14);
    --glass-edge: rgba(255, 255, 255, 0.22);
    --safe-x: 6rem;        /* 5 % of the width: TV overscan safe area */
    --safe-y: 3.75rem;
    --fade: 3s;            /* wallpaper crossfade */
    --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    font-family: "Manrope", "TizenSans", "SamsungOne", -apple-system, "Helvetica Neue", Arial, sans-serif;
    color: var(--white);
    -webkit-font-smoothing: antialiased;
    /* Fallback wallpaper, a dusk over the river: visible until a photo loads, and for good if none ever does. */
    background-color: #0f1a2b;
    background-image:
      radial-gradient(120% 90% at 85% 110%, rgba(214, 120, 92, 0.38) 0%, transparent 55%),
      radial-gradient(90% 70% at 10% 0%, rgba(74, 112, 160, 0.55) 0%, transparent 60%),
      linear-gradient(175deg, #1c2c45 0%, #142036 45%, #241d33 100%);
  }

  /* ---------- Wallpaper ---------- */
  .wall {
    position: fixed; inset: 0; width: 100%; height: 100%;
    object-fit: cover; opacity: 0;
    transition: opacity var(--fade) ease-in-out;
    will-change: opacity, transform;
  }
  .wall.shown { opacity: 1; animation: drift 330s linear forwards; }
  @keyframes drift { from { transform: scale(1.0); } to { transform: scale(1.07); } }

  /* Shade the corners where text sits, leave the middle of the photo untouched. */
  .scrim {
    position: fixed; inset: 0; pointer-events: none;
    background:
      linear-gradient(0deg, rgba(0,0,0,0.70) 0%, rgba(0,0,0,0.30) 34%, rgba(0,0,0,0) 55%),
      linear-gradient(90deg, rgba(0,0,0,0.30) 0%, rgba(0,0,0,0) 45%),
      linear-gradient(180deg, rgba(0,0,0,0.38) 0%, rgba(0,0,0,0) 24%);
    transition: opacity 1.2s ease;
  }

  /* All text and tiles live in .ui, which drifts a few pixels now and then so no pixel on the OLED stays lit the same way for hours. */
  .ui { position: fixed; inset: 0; transition: transform 6s ease-in-out; }

  /* ---------- Clock ---------- */
  .clock {
    position: fixed; left: var(--safe-x); bottom: 24rem;
    text-shadow: 0 0.125rem 2rem rgba(0,0,0,0.25);
    transition: transform 1.2s var(--ease);
    transform-origin: left bottom;
  }
  .time {
    font-size: 12.5rem; font-weight: 300; line-height: 0.9;
    letter-spacing: -0.04em; font-variant-numeric: tabular-nums;
  }
  .date { font-size: 2.25rem; font-weight: 500; color: var(--soft); margin-top: 1.25rem; padding-left: 0.5rem; }

  /* ---------- Weather ---------- */
  .weather {
    position: fixed; top: var(--safe-y); right: var(--safe-x);
    display: flex; align-items: center; gap: 1.25rem;
    opacity: 0; transition: opacity 1s ease;
    text-shadow: 0 0.125rem 1.5rem rgba(0,0,0,0.3);
  }
  .weather.ready { opacity: 1; }
  .weather svg { width: 4.5rem; height: 4.5rem; }
  .w-temp { font-size: 4.5rem; font-weight: 300; line-height: 1; letter-spacing: -0.02em; }
  .w-text { font-size: 1.8rem; font-weight: 500; color: var(--soft); line-height: 1.35; }

  /* ---------- App row ---------- */
  .dock {
    position: fixed; left: var(--safe-x); right: var(--safe-x); bottom: 7.5rem;
    display: flex; gap: 1.375rem; list-style: none;
    transition: opacity 0.8s ease, transform 0.8s var(--ease);
  }
  .tile {
    position: relative;
    width: 10.75rem; height: 6.45rem;             /* 5:3, the tvOS app icon ratio */
    border: 0; border-radius: 1.5rem;
    background: var(--bg); color: var(--fg);
    display: flex; align-items: center; justify-content: center;
    font: inherit; cursor: pointer; outline: none;
    box-shadow: 0 0.75rem 2rem rgba(0,0,0,0.35);
    transition: transform 0.28s var(--ease), box-shadow 0.28s var(--ease);
  }
  .tile svg { width: 3.1rem; height: 3.1rem; fill: currentColor; }
  .tile .word { font-size: 1.7rem; font-weight: 700; letter-spacing: -0.02em; }
  .tile.glass {
    background: var(--glass);
    -webkit-backdrop-filter: blur(1.5rem) saturate(1.4);
    backdrop-filter: blur(1.5rem) saturate(1.4);
    box-shadow: inset 0 0 0 0.0625rem var(--glass-edge), 0 0.75rem 2rem rgba(0,0,0,0.25);
  }
  /* Resting tiles sit slightly back; the focused one comes forward. */
  .tile::before {
    content: ""; position: absolute; inset: 0; border-radius: inherit;
    background: rgba(0,0,0,0.22); transition: opacity 0.28s ease;
  }
  /* Specular sheen across the top, like light on glass. */
  .tile::after {
    content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    background: linear-gradient(165deg, rgba(255,255,255,0.32) 0%, rgba(255,255,255,0.06) 38%, rgba(255,255,255,0) 60%);
    opacity: 0; transition: opacity 0.28s ease;
  }
  .tile.focused {
    transform: translateY(-0.625rem) scale(1.1);
    box-shadow:
      0 0 0 0.1875rem rgba(255,255,255,0.95),
      0 0 2.5rem rgba(255,255,255,0.25),
      0 1.75rem 3.5rem rgba(0,0,0,0.55);
    z-index: 1;
  }
  .tile.focused::before { opacity: 0; }
  .tile.focused::after { opacity: 1; }
  .tile.pressed { transform: translateY(-0.5rem) scale(1.04); transition-duration: 0.12s; }

  .label {
    position: fixed; bottom: 3.75rem; left: var(--safe-x);
    font-size: 1.8rem; font-weight: 600;
    transition: transform 0.28s var(--ease), opacity 0.28s ease;
    white-space: nowrap;
  }

  /* ---------- Photo credit ---------- */
  .credit {
    position: fixed; left: var(--safe-x); top: var(--safe-y);
    max-width: 44rem;
    text-shadow: 0 0.125rem 1.5rem rgba(0,0,0,0.35);
    font-size: 1.4375rem; line-height: 1.4; color: var(--faint);
    transition: opacity 1s ease;
  }
  .credit b { display: block; font-weight: 600; color: var(--soft); }

  /* ---------- Launch veil ---------- */
  .veil {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2.5rem;
    background: rgba(8, 10, 16, 0.55);
    -webkit-backdrop-filter: blur(2.5rem); backdrop-filter: blur(2.5rem);
    opacity: 0; pointer-events: none; transition: opacity 0.35s ease;
  }
  .veil.shown { opacity: 1; }
  .veil .tile { transform: scale(1.6); box-shadow: 0 2rem 5rem rgba(0,0,0,0.5); }
  .veil .tile::before { opacity: 0; }
  .veil-text { margin-top: 3.5rem; font-size: 2.5rem; font-weight: 500; }
  .dots::after { content: ""; animation: dots 1.2s steps(4) infinite; }
  @keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }

  /* ---------- Film info: Up from the app row ---------- */
  .info {
    position: fixed; left: var(--safe-x); bottom: 19rem; width: 64rem;
    text-shadow: 0 0.125rem 1.5rem rgba(0,0,0,0.45);
    opacity: 0; transform: translateY(2rem); pointer-events: none;
    transition: opacity 0.45s ease, transform 0.6s var(--ease);
  }
  body.info-open .info { opacity: 1; transform: none; }
  body.info-open .clock, body.info-open .credit { opacity: 0; }
  body.info-open .scrim { background: linear-gradient(90deg, rgba(0,0,0,0.78) 0%, rgba(0,0,0,0.35) 50%, rgba(0,0,0,0) 72%), linear-gradient(0deg, rgba(0,0,0,0.6) 0%, rgba(0,0,0,0) 40%); }
  body.info-open .dock, body.info-open .label { opacity: 0.35; }
  .clock, .credit { transition: opacity 0.45s ease, transform 1.2s var(--ease); }
  .i-status { display: inline-block; font-size: 1.6rem; font-weight: 700; padding: 0.35rem 1.1rem; border-radius: 0.6rem;
              background: rgba(255,255,255,0.92); color: #111; text-shadow: none; margin-bottom: 1.4rem; }
  .i-status:empty { display: none; }
  .i-title { font-size: 5.5rem; font-weight: 700; line-height: 1.02; letter-spacing: -0.03em; }
  .i-meta { font-size: 2rem; font-weight: 500; color: var(--soft); margin-top: 1.1rem; }
  .i-text { font-size: 1.9rem; line-height: 1.45; color: var(--soft); margin-top: 1.4rem;
            display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  .i-watch { display: flex; align-items: center; gap: 1.5rem; margin-top: 2.2rem; font-size: 2rem; font-weight: 600; }
  .i-watch .tile { width: 8.6rem; height: 5.16rem; }
  .i-watch .tile svg { width: 2.5rem; height: 2.5rem; }
  .i-watch .tile .word { font-size: 1.35rem; }
  .i-hint { color: var(--faint); font-weight: 500; }

  /* ---------- All apps: Down from the app row ---------- */
  .all {
    position: fixed; inset: 0; padding: 7rem var(--safe-x) 0;
    background: rgba(8, 10, 16, 0.6);
    -webkit-backdrop-filter: blur(2.5rem); backdrop-filter: blur(2.5rem);
    opacity: 0; pointer-events: none; transition: opacity 0.35s ease;
  }
  body.all-open .all { opacity: 1; }
  body.all-open .ui { opacity: 0; }
  .all h2 { font-size: 2.6rem; font-weight: 600; margin-bottom: 3rem; }
  .grid { display: flex; flex-wrap: wrap; gap: 3.6rem 1.375rem; list-style: none; transition: transform 0.4s var(--ease); }
  .grid li { width: 10.75rem; }
  .grid .name { font-size: 1.35rem; font-weight: 500; color: var(--soft); margin-top: 0.9rem; text-align: center;
                white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .grid .tile .word { font-size: 1.35rem; padding: 0 0.8rem; text-align: center; line-height: 1.15; }
  .all-viewport { height: 78rem; overflow: hidden; margin: -1.5rem -1.5rem 0; padding: 1.5rem; }   /* room for the focus ring */

  /* After a long time without input the whole screen dims, which spares the OLED panel. */
  .dimmer { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity 8s ease; }
  body.dim .dimmer { opacity: 0.8; }

  /* ---------- Ambient mode: after a while without input, only the photo and the time stay ---------- */
  body.ambient .dock, body.ambient .label { opacity: 0; transform: translateY(2rem); }
  body.ambient .credit { opacity: 0; }
  body.ambient .scrim { opacity: 0.55; }
  body.ambient .clock { transform: translateY(17rem) scale(0.8); }

  @media (prefers-reduced-motion: reduce) {
    :root { --fade: 0.01s; }
    .wall.shown { animation: none; }
    .tile, .tile::before, .tile::after, .label, .dock, .clock, .veil, .ui { transition: none; }
    .tile.focused { transform: none; }
    .tile.pressed { transform: none; }
    .veil .tile { transform: scale(1.6); }
    .dots::after { animation: none; content: "..."; }
  }
</style>

        for (var i = 0; i < list.length; i++) {
          if (m && String(list[i].name || '').toLowerCase().indexOf(m) >= 0) return nativeLaunch(list[i].id);
        }
        throw new Error('not_installed');
      });
    }
    return tryId(0);
  }
  // Apps a person opens: no system parts, helpers or widgets (the same rule as service.js).
  var HIDDEN = /^(org\.tizen\.|com\.samsung\.|com\.tizen\.|org\.volt\.|com\.wssyncmldm|\w+\.TizenBrew|\w+\.TVHome)/i;
  function userApps(list) {
    var seen = {};
    return list.filter(function (a) {
      if (!a.name || a.show === false || HIDDEN.test(a.id) || /service|widget|helper/i.test(a.id)) return false;
      if (seen[a.name]) return false;
      seen[a.name] = 1;
      return true;
    }).map(function (a) { return { id: a.id, name: a.name }; });
  }
  // Remote keys (HDMI 1 to 4, Settings) through the TV's remote-control channel. The first time the TV asks
  // on screen whether to allow "TV Home"; the token it gives is kept so the question does not come again.
  var REMOTES = ['ws://127.0.0.1:8001', 'wss://127.0.0.1:8002'];
  function remoteKey(key, i) {
    if (i >= REMOTES.length) return Promise.reject(new Error('failed'));
    return new Promise(function (resolve, reject) {
      var token = '';
      try { token = localStorage.getItem('tvhome.token') || ''; } catch (e) {}
      var done = false, ws;
      function end(err) {
        if (done) return;
        done = true; clearTimeout(timer);
        try { ws.close(); } catch (e) {}
        err ? reject(err) : resolve();
      }
      var timer = setTimeout(function () { end(new Error('pairing')); }, 35000);
      try {
        ws = new WebSocket(REMOTES[i] + '/api/v2/channels/samsung.remote.control?name=VFYgSG9tZQ==' + (token ? '&token=' + token : ''));
      } catch (e) { return end(new Error('next')); }
      ws.onerror = function () { end(new Error('next')); };
      ws.onmessage = function (ev) {
        var m;
        try { m = JSON.parse(ev.data); } catch (e) { return; }
        if (m.event === 'ms.channel.connect') {
          if (m.data && m.data.token) { try { localStorage.setItem('tvhome.token', String(m.data.token)); } catch (e) {} }
          ws.send(JSON.stringify({ method: 'ms.remote.control',
            params: { Cmd: 'Click', DataOfCmd: key, Option: 'false', TypeOfRemote: 'SendRemoteKey' } }));
          setTimeout(function () { end(); }, 300);
        } else if (m.event === 'ms.channel.unauthorized') end(new Error('next'));
        else if (m.event === 'ms.channel.timeOut') end(new Error('pairing'));
      };
    }).catch(function (err) {
      if (err.message === 'next') return remoteKey(key, i + 1);
      throw err;
    });
  }

  // ===== Ambient mode and OLED care =====
  var idleTimer, dimTimer;
  function wake() {
    var b = document.body;
    var wasAsleep = b.classList.contains('ambient') || b.classList.contains('dim');
    b.classList.remove('ambient'); b.classList.remove('dim');
    clearTimeout(idleTimer); clearTimeout(dimTimer);
    idleTimer = setTimeout(function () {
      if (mode === 'info') closeInfo();
      if (mode === 'all') closeAll();
      b.classList.add('ambient');
    }, AMBIENT_MS);
    dimTimer = setTimeout(function () { b.classList.add('dim'); }, DIM_MS);
    return wasAsleep;
  }
  var SHIFTS = [[0, 0], [0.4, 0.25], [-0.3, 0.35], [-0.4, -0.2], [0.25, -0.35]];   // in rem, a few pixels
  var shiftIndex = 0;
  setInterval(function () {
    shiftIndex = (shiftIndex + 1) % SHIFTS.length;
    $('ui').style.transform = 'translate(' + SHIFTS[shiftIndex][0] + 'rem,' + SHIFTS[shiftIndex][1] + 'rem)';
  }, SHIFT_MS);

  var LEFT = 37, UP = 38, RIGHT = 39, DOWN = 40, OK = 13;
  document.addEventListener('keydown', function (e) {
    var k = e.keyCode;
    var back = k === 10009 || k === 27;                 // Back on the remote, Esc in a browser
    if ([LEFT, UP, RIGHT, DOWN, OK].indexOf(k) >= 0 || back) e.preventDefault();
    if (wake()) return;                                // first press only wakes the screen
    if (launching) { if (back) hideVeil(); return; }
    if (mode === 'info') {
      if (k === DOWN || back) closeInfo();
      else if (k === OK && watchApp) launch(watchApp, watchTile);
      return;
    }
    if (mode === 'all') {
      var cols = columns();
      if (back) closeAll();
      else if (k === LEFT || k === RIGHT) gridFocus(gi + (k === RIGHT ? 1 : -1));
      else if (k === DOWN) { if (gi + cols < gridTiles.length) gridFocus(gi + cols); else if (Math.floor(gi / cols) < Math.floor((gridTiles.length - 1) / cols)) gridFocus(gridTiles.length - 1); }
      else if (k === UP) { if (gi < cols) closeAll(); else gridFocus(gi - cols); }
      else if (k === OK) launch(gridApps[gi], gridTiles[gi]);
      return;
    }
    if (k === LEFT || k === RIGHT) setFocus(current + (k === RIGHT ? 1 : -1));
    else if (k === UP) openInfo();
    else if (k === DOWN) openAll();
    else if (k === OK) launch(APPS[current], tiles[current]);
    // Back on home has nowhere to go.
  });
  document.addEventListener('mousemove', function () { wake(); });
  // Coming back from an app: clear the launch veil and show the app row again.
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) { hideVeil(); wake(); if (mode === 'all') renderGrid(); }
  });

  setFocus(0);
  wake();
  loadInstalled();
  window.addEventListener('resize', function () { if (mode === 'home') setFocus(current); });
</script>
</body>
</html>
